[supervisord]
nodaemon=true
user=%(ENV_WWW_USER)s

[unix_http_server]
file=/tmp/nginx.pid
nodaemon=true
user=%(ENV_WWW_USER)s

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
startretries=3
user=%(ENV_WWW_USER)s
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

# run composer on start
[program:composer]
user=%(ENV_WWW_USER)s
command=bash -c 'sleep 3 && cd /var/www/html/backend && composer install --ignore-platform-reqs --no-scripts'
autostart=true
startretries=3
autorestart=false
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
