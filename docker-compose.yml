services:
    nginx:
        image: nginx:alpine
        container_name: ${APP_NAME}_nginx
        volumes:
            - "./docker/etc/nginx/nginx.conf:/etc/nginx/nginx.conf"
            - "./docker/etc/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf"
            - "./:/var/www/html"
            - "./docker/etc/nginx/conf.d/default.template.conf:/etc/nginx/conf.d/default.template"
            - "./docker/etc/nginx/nginx_error.log:/var/log/nginx/nginx_error.log"
            - "./docker/etc/nginx/nginx_access.log:/var/log/nginx/nginx_access.log"
        ports:
            - "127.0.0.1:${NGINX_PORT}:80"
        environment:
            - NGINX_HOST=${NGINX_HOST}
        command: /bin/sh -c "envsubst '$$NGINX_HOST' < /etc/nginx/conf.d/default.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
        restart: unless-stopped
        depends_on:
            - php

    php:
        build:
            context: ./docker/php
            args:
                - XDEBUG=${XDEBUG}
                - WWW_USER=${WWW_USER}
                - WWW_UID=${WWW_UID}
                - WWW_GID=${WWW_GID}
                - WWW_ROOT_PWD=${WWW_ROOT_PWD}
                - ARCH=${ARCH}
        container_name: ${APP_NAME}_php
        env_file:
            - ".env"
        volumes:
            - "./docker/etc/php/php.ini:/usr/local/etc/php/php.ini"
            - "./:/var/www/html"
            - "./docker/etc/php/log:/var/log"
            - "./docker/etc/php/docker.conf:/usr/local/etc/php-fpm.d/docker.conf"
            - "./docker/php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini"
            - "./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf"
            - "./docker/php/crontab:/etc/cron.d/crontab"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        restart: unless-stopped
        environment:
            # - PHP_IDE_CONFIG=serverName=localhost
            - ENABLE_CRON=${ENABLE_CRON:-false} # default value, if not set in .env
            - ENABLE_CREATE_PACKAGE_INSTANCE_WORKER=${ENABLE_CREATE_PACKAGE_INSTANCE_WORKER:-false} # default value, if not set in .env
        user: ${WWW_USER}:${WWW_USER}
